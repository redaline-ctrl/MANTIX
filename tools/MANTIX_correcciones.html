<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANTIX · Correcciones</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061321;color:#eef8ff;font:14px/1.5 'Segoe UI',sans-serif}header{background:#10283b;border-bottom:1px solid #287d8c;padding:18px 25px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:22px;letter-spacing:3px}nav{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}a{color:#6de7ee}main{max-width:1000px;margin:auto;padding:25px}h1{font-size:26px}h2{font-size:18px}p,small{color:#a8bfd0}.card{border:1px solid #31556d;background:#102337;border-radius:13px;padding:22px;margin:18px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:12px;color:#bddce9;margin:12px 0 5px}input,textarea{width:100%;min-width:0;background:#071827;color:white;border:1px solid #42677f;border-radius:7px;padding:11px;font:inherit}textarea{min-height:105px;resize:vertical}button{font:inherit;padding:11px 17px;color:white;background:#08796c;border:1px solid #34b49e;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.picker{max-height:190px;overflow:auto;border:1px solid #315269;border-radius:8px;padding:7px}.picker label{display:flex;align-items:start;gap:10px;padding:7px;margin:0;font-size:13px}.picker input{width:18px;flex:none;accent-color:#4ee2bc;margin-top:2px}.notice{border:1px solid #388b90;background:#0c3540;padding:14px;border-radius:8px;white-space:pre-wrap;margin:15px 0}.error{background:#3c2230;border-color:#b46b7e;color:#ffc5cf}.reason{border-left:3px solid #e4b969;padding:10px 15px;background:#152c3c}.empty{padding:25px;border:1px dashed #42677f;border-radius:10px}.saved{color:#a0ead8}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #80f9df;outline-offset:2px}@media(max-width:600px){main{padding:15px}.fields{grid-template-columns:1fr}.card{padding:17px}nav{margin-left:0}}
</style></head><body><header><strong>MANTIX</strong><span>Correcciones del supervisor</span><nav><a href="/centro">Mi centro</a><a href="/bitacora">Mi bitácora</a><a href="/historial">Mi historial</a></nav></header><main><h1>Trabajos para corregir</h1><p>Consulta el motivo del jefe, completa la información y reenvíala. Tu jornada permanece cerrada y se conserva la versión anterior.</p><div id="message" role="status" aria-live="polite"></div><button id="reload">Actualizar</button><div id="rows"></div></main><script>
'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let employees=[],dirty=false,saving=false;
function local(v){if(!v)return '';const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function msg(s,bad=false){$('message').className='notice'+(bad?' error':'');$('message').textContent=s;}
async function api(url,body){const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-MANTIX-Local':'1'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la solicitud.');return d;}
async function load(){const r=await api('/api/v2/correcciones/mias');$('rows').replaceChildren();for(const s of r.datos){const e=document.createElement('section');e.className='card';e.innerHTML=`<h2>${esc(s.numero_orden||'Operativo sin código')} · versión ${s.version}</h2><p>${esc(s.descripcion)}</p><div class="reason"><strong>Motivo de la corrección</strong><p>${esc(s.motivo)}</p></div>${s.estado==='AUTORIZADA'?`<form><label>Actividades corregidas<textarea class="acts" minlength="5" maxlength="5000" required>${esc(s.actividades)}</textarea></label><div class="fields"><div><label>Inicio real<input type="datetime-local" class="start" value="${local(s.inicio_real)}" ${s.estado_intervencion==='TERMINADA'?'required':''}></label></div><div><label>Fin real<input type="datetime-local" class="end" value="${local(s.fin_real)}" ${s.estado_intervencion==='TERMINADA'?'required':''}></label></div></div><label>Ejecutantes · selecciona con las casillas</label><input type="search" class="search" placeholder="Buscar por nombre…" aria-label="Buscar ejecutante"><div class="picker"></div><div class="actions"><button type="submit">Guardar y reenviar al jefe</button></div></form>`:'<p class="saved">La corrección ya fue guardada. Falta enviarla al jefe.</p><button class="resend">Reenviar al jefe</button>'}<div class="feedback" role="status"></div>`;
 const picked=new Set(s.ejecutantes||[]);function draw(){const q=e.querySelector('.search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();e.querySelector('.picker').innerHTML=employees.filter(x=>x.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)).map(x=>`<label><input type="checkbox" value="${x.id}" ${picked.has(x.id)?'checked':''}>${esc(x.nombre)}${x.activo?'':' · inactivo'}</label>`).join('')||'<p>Sin coincidencias.</p>';e.querySelectorAll('.picker input').forEach(box=>box.onchange=()=>{box.checked?picked.add(box.value):picked.delete(box.value);dirty=true;});}
 if(s.estado==='AUTORIZADA'){draw();e.querySelector('.search').oninput=draw;e.querySelector('form').oninput=ev=>{if(ev.target.type!=='search')dirty=true;};}
 const handler=async ev=>{ev?.preventDefault();if(saving)return;saving=true;const button=e.querySelector('button'),feedback=e.querySelector('.feedback');button.disabled=true;$('reload').disabled=true;
 try{
  if(s.estado==='AUTORIZADA'){
   const start=e.querySelector('.start').value,end=e.querySelector('.end').value;
   await api('/api/v2/correcciones/'+s.id+'/aplicar',{version:s.version,actividades:e.querySelector('.acts').value,inicio:start?new Date(start).toISOString():null,fin:end?new Date(end).toISOString():null,ejecutantes:[...picked]});
   s.estado='APLICADA';e.querySelectorAll('input,textarea').forEach(x=>x.disabled=true);dirty=false;button.textContent='Reenviar al jefe';
  }
  await api('/api/v2/correcciones/'+s.id+'/enviar',{});e.remove();msg('Corrección guardada y enviada al jefe. El historial anterior y el cierre del turno se conservaron.');if(!$('rows').children.length)$('rows').innerHTML='<p class="empty">No tienes correcciones pendientes de envío.</p>';
 }catch(err){feedback.className='feedback notice error';feedback.textContent=err.message;if(s.estado==='APLICADA')feedback.textContent+=' La corrección quedó guardada; pulsa Reenviar para completar el envío.';}
 finally{saving=false;button.disabled=false;$('reload').disabled=false;}};
 if(s.estado==='AUTORIZADA')e.querySelector('form').onsubmit=handler;else e.querySelector('.resend').onclick=handler;$('rows').append(e);
 }if(!r.datos.length)$('rows').innerHTML='<p class="empty">No tienes correcciones autorizadas pendientes. Las nuevas devoluciones del jefe aparecerán aquí.</p>';}
$('reload').onclick=()=>{if(!dirty||confirm('Hay cambios sin guardar. ¿Descartarlos y actualizar?')){dirty=false;load().catch(e=>msg(e.message,true));}};addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
(async()=>{await api('/api/me');employees=(await api('/api/catalogos/empleados')).datos;await load();})().catch(e=>msg(e.message,true));
</script></body></html>
