<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"> 
<title>MANTIX - ISYSA Las Coloradas</title> 

<style> 

:root{
--bg:#020617;
--card:#0f172a;
--line:#1e293b;
--cyan:#22d3ee;
--blue:#0ea5e9;
--txt:#f1f5f9;
--muted:#94a3b8;
--green:#22c55e;
--red:#ef4444
} 

*{
box-sizing:border-box
}

/* =====================================================
   FONDO — SOLO DISEÑO
===================================================== */

body{
margin:0;
min-height:100vh;

background:
radial-gradient(
circle at 50% -15%,
rgba(34,211,238,.25) 0%,
rgba(14,165,233,.16) 18%,
rgba(6,21,35,.75) 42%,
#020617 75%
),

radial-gradient(
circle at 0% 100%,
rgba(14,165,233,.14),
transparent 38%
),

radial-gradient(
circle at 100% 100%,
rgba(34,211,238,.10),
transparent 38%
),

linear-gradient(
135deg,
#020617 0%,
#061523 45%,
#020617 100%
);

font-family:'Segoe UI',Arial,sans-serif;
color:var(--txt);
display:grid;
place-items:center;
padding:20px;

position:relative;
overflow:hidden;
}

/* brillo ambiental superior */

body::before{
content:"";
position:absolute;

width:700px;
height:700px;

top:-480px;
left:50%;

transform:translateX(-50%);

background:
radial-gradient(
circle,
rgba(34,211,238,.22) 0%,
rgba(14,165,233,.10) 30%,
transparent 70%
);

filter:blur(15px);

pointer-events:none;

animation:
brilloFondo 7s ease-in-out infinite;
}

/* brillo lateral */

body::after{
content:"";
position:absolute;

width:500px;
height:500px;

bottom:-300px;
right:-180px;

background:
radial-gradient(
circle,
rgba(14,165,233,.12),
transparent 70%
);

filter:blur(20px);

pointer-events:none;

animation:
brilloLateral 9s ease-in-out infinite;
}


/* =====================================================
   TARJETA
   — MISMA ESTRUCTURA, SOLO EFECTO VISUAL
===================================================== */

.login{
width:min(430px,100%);

background:
linear-gradient(
180deg,
rgba(15,23,42,.98),
rgba(2,6,23,.98)
);

border:1px solid rgba(34,211,238,.25);

border-radius:22px;

padding:30px;

box-shadow:
0 30px 100px rgba(0,0,0,.55),
0 0 50px rgba(14,165,233,.06),
inset 0 1px 0 rgba(255,255,255,.035);

position:relative;

z-index:2;
}

/* línea luminosa superior de la tarjeta */

.login::before{
content:"";

position:absolute;

top:0;
left:15%;

width:70%;
height:1px;

background:
linear-gradient(
90deg,
transparent,
var(--cyan),
var(--blue),
transparent
);

box-shadow:
0 0 12px rgba(34,211,238,.7),
0 0 25px rgba(14,165,233,.35);

opacity:.8;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

width:76px;
height:76px;

margin:0 auto 15px;

border:1px solid rgba(34,211,238,.45);

border-radius:20px;

display:grid;
place-items:center;

position:relative;

background:
radial-gradient(
circle,
rgba(34,211,238,.12),
rgba(2,6,23,.75) 70%
);

box-shadow:
0 0 20px rgba(34,211,238,.20),
0 0 45px rgba(14,165,233,.13),
inset 0 0 20px rgba(34,211,238,.06);

overflow:hidden;

animation:
pulsoLogo 4s ease-in-out infinite;
}


/* aro de luz */

.logo::before{

content:"";

position:absolute;

inset:-2px;

border-radius:22px;

background:
conic-gradient(
from 0deg,
transparent 0deg,
rgba(34,211,238,.7) 90deg,
transparent 160deg,
rgba(14,165,233,.7) 250deg,
transparent 330deg
);

animation:
giroLogo 5s linear infinite;

opacity:.55;

z-index:0;
}


/* brillo interno */

.logo::after{

content:"";

position:absolute;

width:65px;
height:65px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(34,211,238,.20),
transparent 70%
);

filter:blur(7px);

animation:
destelloLogo 3s ease-in-out infinite;

z-index:0;
}


/* imagen real */

.logo img{

width:62px;
height:62px;

object-fit:contain;

position:relative;

z-index:2;

filter:
drop-shadow(0 0 5px rgba(34,211,238,.55))
drop-shadow(0 0 14px rgba(14,165,233,.35));

}


/* =====================================================
   TITULO MANTIX
===================================================== */

.mantix{

font-size:28px;

font-weight:900;

letter-spacing:5px;

text-align:center;

background:
linear-gradient(
90deg,
#22d3ee,
#38bdf8,
#60a5fa,
#22d3ee,
#67e8f9,
#22d3ee
);

background-size:300% 100%;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

text-shadow:
0 0 15px rgba(34,211,238,.18);

animation:
cambioColor 5s ease-in-out infinite;

}


/* =====================================================
   SUBTITULO
===================================================== */

.sub{

color:var(--muted);

font-size:11px;

margin-top:3px;

text-align:center;

}


/* =====================================================
   RESTO — SIN CAMBIAR LA LOGICA
===================================================== */

.week{
margin:22px 0 15px;
padding:12px;
border:1px solid rgba(34,211,238,.18);
border-radius:12px;
background:rgba(14,165,233,.05);
font-size:11px;
color:#cbd5e1
}

.field{
margin-top:12px
}

.field label{
display:block;
color:#7dd3fc;
font-size:10px;
font-weight:800;
margin-bottom:6px;
letter-spacing:.6px
}

input{
width:100%;
padding:12px;
background:#020617;
border:1px solid #334155;
border-radius:10px;
color:white;
outline:none
}

input:focus{
border-color:var(--cyan)
}

button{
width:100%;
margin-top:18px;
padding:12px;
border:0;
border-radius:10px;

background:
linear-gradient(
90deg,
#0ea5e9,
#22d3ee,
#0ea5e9
);

background-size:200% 100%;

color:#020617;
font-weight:900;
cursor:pointer;

transition:
background-position .4s ease,
box-shadow .3s ease,
transform .2s ease;
}

button:hover{

background-position:100% 0;

box-shadow:
0 0 20px rgba(34,211,238,.25);

transform:translateY(-1px);
}

.hint{
margin-top:15px;
color:#64748b;
font-size:9px;
text-align:center;
line-height:1.5
}

.error{
display:none;
margin-top:12px;
background:rgba(239,68,68,.1);
border:1px solid rgba(239,68,68,.3);
color:#fca5a5;
padding:10px;
border-radius:9px;
font-size:11px
}

.footer{
margin-top:20px;
text-align:center;
color:#475569;
font-size:9px
}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes brilloFondo{

0%,100%{
opacity:.65;
transform:translateX(-50%) scale(1);
}

50%{
opacity:1;
transform:translateX(-50%) scale(1.12);
}

}

@keyframes brilloLateral{

0%,100%{
opacity:.5;
transform:scale(1);
}

50%{
opacity:1;
transform:scale(1.15);
}

}

@keyframes pulsoLogo{

0%,100%{

box-shadow:
0 0 20px rgba(34,211,238,.18),
0 0 45px rgba(14,165,233,.10),
inset 0 0 20px rgba(34,211,238,.05);

}

50%{

box-shadow:
0 0 28px rgba(34,211,238,.35),
0 0 65px rgba(14,165,233,.18),
inset 0 0 25px rgba(34,211,238,.10);

}

}

@keyframes giroLogo{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

@keyframes destelloLogo{

0%,100%{
opacity:.35;
transform:scale(.8);
}

50%{
opacity:.8;
transform:scale(1.08);
}

}

@keyframes cambioColor{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

</style> 
</head> 

<body> 

<div class="login"> 

  <div class="logo">
    <img src="logo.png" alt="ISYSA">
  </div>

  <div class="mantix">MANTIX</div>

  <div class="sub">
    MANTENIMIENTO INDUSTRIAL · ISYSA LAS COLORADAS
  </div> 

  <div class="week" id="semanaInfo">
    Calculando semana...
  </div> 

  <div class="field">
    <label>USUARIO</label>
    <input id="usuario" autocomplete="username" placeholder="Ej. victor.canto">
  </div> 

  <div class="field">
    <label>CONTRASEÑA</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
  </div> 

  <button onclick="entrar()">INICIAR SESIÓN</button> 

  <div class="error" id="error"></div> 

  <div class="hint">
    La sesión determina automáticamente el rol, supervisor, letra y turno. La rotación se basa en la semana.
  </div> 

  <div class="footer">
    MANTIX · Por Jacqueline Reda · ISYSA 2025
  </div> 

</div> 

<script> 

const usuarios=[ 

 {user:'victor.canto',password:'1234',nombre:'Victor Canto Canto',rol:'supervisor',tipoSupervisor:'ROTATIVO'}, 

 {user:'santos.puc',password:'1234',nombre:'Santos Puc',rol:'supervisor',tipoSupervisor:'ROTATIVO'}, 

 {user:'venancio.puc',password:'1234',nombre:'Venancio Puc Kuk',rol:'supervisor',tipoSupervisor:'ROTATIVO'}, 

 {user:'edgar.sup',password:'1234',nombre:'Edgar',rol:'supervisor',tipoSupervisor:'QUEBRADO',letra:'Q1',turno:'TURNO MAÑANA QUEBRADO 07:00-12:00 / 14:00-17:00'}, 

 {user:'jocsan.sup',password:'1234',nombre:'Jocsan',rol:'supervisor',tipoSupervisor:'QUEBRADO',letra:'Q2',turno:'TURNO MAÑANA QUEBRADO 07:00-12:00 / 14:00-17:00'}, 

 {user:'lorenzo.sup',password:'1234',nombre:'Lorenzo',rol:'supervisor',tipoSupervisor:'QUEBRADO',letra:'Q3',turno:'TURNO MAÑANA QUEBRADO 07:00-12:00 / 14:00-17:00'}, 

 {user:'jesus.sup',password:'1234',nombre:'Jesus',rol:'supervisor',tipoSupervisor:'QUEBRADO',letra:'Q4',turno:'TURNO MAÑANA QUEBRADO 07:00-12:00 / 14:00-17:00'}, 

 {user:'bryan.sup',password:'1234',nombre:'Bryan',rol:'supervisor',tipoSupervisor:'QUEBRADO',letra:'Q5',turno:'TURNO MAÑANA QUEBRADO 07:00-12:00 / 14:00-17:00'}, 

 {user:'manuel.jefe',password:'1234',nombre:'Manuel',rol:'jefe',tipoSupervisor:'JEFE'}, 

 {user:'roberto.coordinador',password:'1234',nombre:'Roberto',rol:'coordinador',tipoSupervisor:'COORDINADOR'} 

]; 

function getSem(){
let d=new Date(),
j1=new Date(d.getFullYear(),0,1);

return Math.ceil(
(((d-j1)/86400000)+j1.getDay()+1)/7
)
} 

function getRot(sem){

let offset=(sem-38)%3;

if(offset<0)offset+=3;

let mapa={

0:{
'victor.canto':{
letra:'A',
turno:'3ER TURNO 23:00-07:00'
},

'santos.puc':{
letra:'C',
turno:'2DO TURNO 15:00-23:00'
},

'venancio.puc':{
letra:'B',
turno:'1ER TURNO 07:00-15:00'
}
},

1:{
'victor.canto':{
letra:'C',
turno:'2DO TURNO 15:00-23:00'
},

'santos.puc':{
letra:'B',
turno:'1ER TURNO 07:00-15:00'
},

'venancio.puc':{
letra:'A',
turno:'3ER TURNO 23:00-07:00'
}
},

2:{
'victor.canto':{
letra:'B',
turno:'1ER TURNO 07:00-15:00'
},

'santos.puc':{
letra:'A',
turno:'3ER TURNO 23:00-07:00'
},

'venancio.puc':{
letra:'C',
turno:'2DO TURNO 15:00-23:00'
}
}

};

return mapa[offset]

} 

const sem=getSem();

document.getElementById('semanaInfo').textContent=
`Semana ${sem} · Rotación A → B → C`; 

function entrar(){

const u=
document
.getElementById('usuario')
.value
.trim()
.toLowerCase();

const p=
document
.getElementById('password')
.value;

const err=
document.getElementById('error');

const base=
usuarios.find(
x=>x.user===u&&x.password===p
);

if(!base){

err.textContent=
'Usuario o contraseña incorrectos.';

err.style.display='block';

return
}

let s={
...base,
usuario:base.user,
user:base.user,
fechaLogin:new Date().toISOString(),
semana:sem
};

if(base.tipoSupervisor==='ROTATIVO'){

const r=getRot(sem)[base.user];

s.letra=r.letra;
s.turno=r.turno

}

localStorage.setItem(
'isy_session',
JSON.stringify(s)
);

location.href=
s.rol==='supervisor'
?'index.html'
:s.rol==='jefe'
?'revisado.html'
:'dashboard.html'

} 

document.addEventListener(
'keydown',
e=>{
if(e.key==='Enter')entrar()
}
); 

</script> 

</body>
</html>
